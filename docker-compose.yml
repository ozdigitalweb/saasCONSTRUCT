version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: saasconstruct_db
    restart: always
    environment:
      POSTGRES_DB: mvp1_adequacao
      POSTGRES_USER: mvp1_app
      POSTGRES_PASSWORD: mvp1_senha_super_segura
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_criar_tabelas.sql:/docker-entrypoint-initdb.d/01_criar_tabelas.sql
      - ./db/02_gatilho_atualizado_em.sql:/docker-entrypoint-initdb.d/02_gatilho_atualizado_em.sql
      - ./db/03_dados_de_teste_opcional.sql:/docker-entrypoint-initdb.d/03_dados_de_teste_opcional.sql
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: saasconstruct_app
    restart: always
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mvp1_app:mvp1_senha_super_segura@db:5432/mvp1_adequacao
    ports:
      - "3000:3000"

volumes:
  pgdata:
